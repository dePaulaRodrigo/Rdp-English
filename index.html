<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://xmvjxzqpwnwxjouxaoar.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>English Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4ef; --card:#ffffff; --ink:#1c2230; --muted:#687083; --line:#e4e2da;
  --accent:#2f47c9; --accent-soft:#e8ecfc; --ok:#1d7f48; --ok-soft:#e3f4ea;
  --bad:#c0392b; --bad-soft:#fbe9e6; --warn-soft:#fff6dc;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:17px;line-height:1.55}
html{color-scheme:light}
button{font:inherit;cursor:pointer;color:inherit;-webkit-text-fill-color:currentColor}
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
.top .in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{white-space:nowrap;font-weight:800;letter-spacing:-.01em;font-size:18px;cursor:pointer;display:flex;align-items:center;gap:8px}
.brand .dot{width:22px;height:22px;border-radius:7px;background:var(--accent);display:grid;place-items:center;font-size:13px}
.spacer{flex:1}
.codepill{font-size:13px;background:rgba(255,255,255,.12);border:0;color:#fff;padding:6px 10px;border-radius:999px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:820px;margin:0 auto;padding:20px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
h1{font-size:28px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:21px;margin:0 0 8px;letter-spacing:-.01em}
h3{font-size:17px;margin:18px 0 8px}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.plain{background:#eceae3;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input.code{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fbfaf7}
input.code:focus{outline:2px solid var(--accent);border-color:transparent}
.bigcode{font-size:22px;font-weight:800;letter-spacing:.01em;background:var(--accent-soft);color:var(--accent);padding:14px 16px;border-radius:12px;word-spacing:6px;text-align:center}
.note{background:var(--warn-soft);border-radius:10px;padding:10px 14px;font-size:14px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
/* library */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:16px}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .12s, box-shadow .12s}
.lcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(28,34,48,.08)}
.lcard .art{height:96px;display:flex;align-items:center;justify-content:center;font-size:44px}
.lcard .body{padding:14px 16px 16px}
.lcard .t{font-weight:700;font-size:17px;line-height:1.3}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#eceae3;color:#4a5160}
.tag.lv{background:var(--accent-soft);color:var(--accent)}
.bar{height:6px;border-radius:9px;background:#eceae3;margin-top:12px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
/* lesson */
.crumb{font-size:14px;color:var(--muted);margin-bottom:8px}
.crumb a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 0}
.tab{white-space:nowrap;border:1px solid var(--line);border-bottom:0;background:#eceae3;padding:10px 16px;border-radius:12px 12px 0 0;font-weight:700;color:#4a5160}
.tab.on{background:var(--card);color:var(--accent)}
.panel{border-top-left-radius:0}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.pg{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700;position:relative}
.pg.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pg.done::after{content:"";position:absolute;right:-3px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid #fff}
.instr{background:#f3f2ed;border-radius:10px;padding:12px 14px;margin:12px 0 18px;font-size:15px}
/* MC */
.q{padding:16px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.qn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:800;margin-right:8px;vertical-align:1px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:1.5px solid #cfd2dc;background:#fff;color:var(--ink);border-radius:10px;padding:10px 12px;text-align:left;font-size:16px;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default;color:#4a5160;opacity:1}
.opt.sel{border-color:var(--accent);background:#eef1fc;font-weight:600}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:#0f5130;font-weight:600}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:#7d1f15;text-decoration:line-through}
.why{margin-top:10px;font-size:14.5px;padding:9px 12px;border-radius:9px}
.why.ok{background:var(--ok-soft)} .why.no{background:var(--bad-soft)}
/* gap */
.lines p{margin:0 0 10px}
.lines.list p{display:flex;gap:10px}
.lines.list .num{color:var(--muted);font-weight:700;min-width:22px}
.sp{font-weight:700}
.scene{font-style:italic;color:var(--muted);font-size:15px;margin-bottom:14px}
.blank{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:0;margin:0 2px;vertical-align:baseline}
.blank .n{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;padding:0 5px}
.blank .v{display:inline-block;min-width:92px;border-bottom:2px solid #b9bccb;padding:0 4px;font-weight:600;color:var(--accent);text-align:left}
.blank.active .v{border-color:var(--accent);background:var(--accent-soft);border-radius:5px 5px 0 0}
.blank.ok .v{color:var(--ok);border-color:var(--ok)}
.blank.no .v{color:var(--bad);border-color:var(--bad);text-decoration:line-through}
.blank .fix{color:var(--ok);font-weight:700}
.blank:disabled{cursor:default}
.center{text-align:center;margin-top:22px}
.score{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin-top:20px}
.score b{font-size:26px;color:var(--accent)}
.score .msg{flex:1 1 170px}
.score .btn{margin-left:auto}
.corr{margin-top:16px;font-size:15px}
.corr div{padding:8px 0;border-top:1px solid var(--line)}
.corr .k{font-weight:800;margin-right:6px}
.corr .ok{color:var(--ok)} .corr .no{color:var(--bad)}
/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(28,34,48,.12);transform:translateY(110%);transition:transform .18s}
.sheet.open{transform:none}
.sheet .in{max-width:820px;margin:0 auto;padding:12px 16px 18px}
.sheet .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-height:38vh;overflow:auto}
.chip{border:1.5px solid #cfd2dc;background:#fafaf7;color:var(--ink);border-radius:999px;padding:8px 14px;font-size:15.5px;font-weight:600}
.chip:hover{border-color:var(--accent)}
.chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.x{border:0;background:#eceae3;border-radius:8px;padding:6px 10px;font-weight:700}
/* explanation */
.expl{overflow-x:auto}
.expl table.countries tr.c td{background:#f3f2ed;font-weight:700;border-bottom:0}
.expl table{width:100%;border-collapse:collapse;margin:8px 0 18px;font-size:15px}
.expl th,.expl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.expl th{background:#f3f2ed}
.expl ul{padding-left:20px}
.resetbar{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;align-items:center;margin:-6px 0 14px;font-size:14.5px;min-height:8px}
.linkbtn{border:0;background:none;color:var(--bad);font-weight:700;padding:6px 2px}
.btn.sm{padding:8px 14px;font-size:14.5px}
.btn.danger{background:var(--bad)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.on{opacity:1}
h2.area{margin:28px 0 12px}
.metarow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.langsw{display:flex;margin-left:auto;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langsw button{border:0;background:transparent;padding:6px 12px;font-weight:700;font-size:13px;color:#4a5160;cursor:pointer}
.langsw button.on{background:var(--accent);color:#fff}
@media (max-width:520px){.expl table{font-size:14px}.expl th,.expl td{padding:6px 7px}}
@media (max-width:380px){.expl table{font-size:13px}.expl th,.expl td{padding:5px 5px}}
@media (max-width:520px){.tabs{gap:4px}.tab{padding:9px 11px;font-size:15px}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand" id="brand"><span class="dot">✓</span>English Practice</div>
  <div class="spacer"></div>
  <button class="codepill" id="codepill" hidden></button>
</div></header>
<main id="app"></main>
<div class="sheet" id="sheet"><div class="in">
  <div class="hd"><span id="sheetTitle"></span><span class="spacer"></span><button class="x" id="sheetClear"></button><button class="x" id="sheetClose"></button></div>
  <div class="chips" id="chips"></div>
</div></div>
<div class="toast" id="toast"></div>

<script src="lessons/catalog.js"></script>
<script>
/* ============================================================
   TEXTOS DA INTERFACE
   Para acrescentar um idioma: copie o bloco "pt", traduza e acrescente o código em UI_LANGS.
   ============================================================ */
const UI_LANGS = ["pt"];
const UI = { pt:{
  loading:"Carregando…", loadingLesson:"Carregando a lição…",
  loadFail:"Não foi possível carregar a lição. Verifique a conexão com a internet.", retry:"Tentar novamente", back:"Voltar",
  gateTitle:"Pratique inglês com o seu código", gateSub:"Sem login e sem senha. Seu código guarda o seu progresso.",
  haveCode:"Já tem um código?", codePlaceholder:"ex.: piano tiger orbit honey", enter:"Entrar", entering:"Entrando…",
  firstTime:"Primeira vez?", generate:"Gerar meu código", generating:"Gerando…", anyDevice:"O mesmo código funciona em qualquer aparelho.",
  codeWords:"O código tem 4 palavras.", codeNotFound:"Código não encontrado. Confira as 4 palavras.",
  serverDown:"Sem conexão com o servidor. Tente novamente em instantes.",
  tooManyTries:"Muitas tentativas com códigos inexistentes a partir desta conexão. Aguarde uma hora e tente novamente.",
  noNewCodes:"Não é possível gerar códigos novos neste momento. Tente novamente mais tarde.",
  offlineCached:"Sem conexão. Usando o progresso salvo neste aparelho.",
  offlineSaved:"Sem conexão. O progresso foi salvo neste aparelho e será enviado quando a internet voltar.",
  newCodeTitle:"Este é o seu código", newCodeSub:"Anote em algum lugar seguro. É com ele que você volta ao seu progresso. Quem tiver o código vê a sua sessão.",
  copyCode:"Copiar código", copy:"Copiar", noted:"Anotei, continuar", copied:"Código copiado.", copyFail:"Não foi possível copiar. Anote o código.",
  yourCode:"Seu código", logout:"Sair", logoutNote:"Ao sair, o progresso continua guardado com este código.",
  lessons:"Lições", lessonsSub:"Gramática praticada com o vocabulário da sua área.", exDone:"{done} de {total} exercícios feitos",
  exercises:"Exercícios:", tabExpl:"Explicação", tabPractice:"Prática", tabVocab:"Vocabulário", explLang:"Idioma das explicações",
  correct:"Correto.", answered:"{n} de {total} respondidas", filled:"{n} de {total} preenchidas", check:"Corrigir respostas",
  missingItem1:"Há 1 item sem resposta; ele conta como erro.", missingItemN:"Há {n} itens sem resposta; eles contam como erros.",
  missingBlank1:"Há 1 lacuna sem resposta; ela conta como erro.", missingBlankN:"Há {n} lacunas sem resposta; elas contam como erros.",
  perfect:"Perfeito.", good:"Bom resultado. Revise os itens marcados em vermelho.", retryExpl:"Revisite a explicação e tente novamente.", redo:"Refazer",
  resetAsk:"↺ Apagar respostas e recomeçar", resetConfirm:"Apagar todas as suas respostas deste exercício?", cancel:"Cancelar", erase:"Apagar", erased:"Respostas apagadas.",
  blank:"Lacuna {n}", also:"também aceito", chooseOption:"Escolha a opção", clear:"Limpar", close:"Fechar"
}};
function uiLang(){ const l = S.data && S.data.prefs && S.data.prefs.ui; return UI_LANGS.includes(l) ? l : UI_LANGS[0]; }
function t(key, vars){
  let s = (UI[uiLang()]||{})[key] ?? UI.pt[key] ?? key;
  if(vars) for(const k in vars) s = s.split("{"+k+"}").join(vars[k]);
  return s;
}

/* ============================================================
   CONTEÚDO
   ============================================================ */
/* O catálogo (lessons/catalog.js) traz só o resumo de cada lição.
   O conteúdo completo de cada uma fica em lessons/<id>.js e só é baixado quando o aluno abre a lição. */
const LOADED = {}, pending = {};
function addLesson(o){ LOADED[o.id] = o; if(pending[o.id]){ pending[o.id].res(o); delete pending[o.id]; } }
function loadLesson(meta){
  if(LOADED[meta.id]) return Promise.resolve(LOADED[meta.id]);
  if(pending[meta.id]) return pending[meta.id].p;
  let res, rej; const p = new Promise((a,b)=>{ res=a; rej=b; });
  pending[meta.id] = {p, res};
  const sc = document.createElement("script");
  sc.src = `lessons/${meta.id}.js?v=${meta.v}`;
  sc.onerror = () => { delete pending[meta.id]; sc.remove(); rej(new Error("load")); };
  document.head.appendChild(sc);
  return p;
}

/* ============================================================
   SESSÃO POR CÓDIGO (Supabase; cópia de segurança neste navegador)
   ============================================================ */
const WORDS = "able acid actor agent album angle apple arena arrow atom autumn baby badge baker bamboo banana basket beach bean bell bird blanket boat bonus book bottle brain bread brick bridge brush bubble cable cactus camera candle canoe canvas carbon carpet castle cattle cereal chair cheese cherry circle citizen clock cloud coffee comet copper corn cotton crane crystal desert diamond dolphin donkey dragon drum eagle earth echo engine falcon feather fiber field flute forest fossil fruit galaxy garden giant ginger glass globe grape guitar hammer harbor helmet honey horse island ivory jacket jungle kettle ladder lemon library lion lizard magnet mango marble meadow melon mirror monkey motor needle ocean olive orange orbit oyster panda paper parrot peanut pepper piano pillow planet pocket potato pumpkin puzzle rabbit radio rocket saddle salmon silver spider spoon sugar summer tiger tomato tunnel turtle valley violin wagon walnut whale window winter wizard yogurt zebra".split(" ");
const STORE_KEY = "englishPractice.sessions.v1";
const LAST_KEY = "englishPractice.lastCode.v1";
let memStore = {};
function loadAll(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||"{}"); }catch(e){ return memStore; } }
function saveAll(all){ memStore = all; try{ localStorage.setItem(STORE_KEY, JSON.stringify(all)); }catch(e){} }
function getLast(){ try{ return localStorage.getItem(LAST_KEY); }catch(e){ return null; } }
function setLast(c){ try{ c ? localStorage.setItem(LAST_KEY,c) : localStorage.removeItem(LAST_KEY); }catch(e){} }
function normCode(s){ return (s||"").toLowerCase().replace(/[^a-z\s-]/g," ").split(/[\s-]+/).filter(Boolean).join(" "); }
const SB_URL = "https://xmvjxzqpwnwxjouxaoar.supabase.co";
const SB_KEY = "sb_publishable_FKNyXJrsHPjt0dHnn_rsBQ_HVb2ipA_";
async function rpc(fn, args){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {method:"POST", headers:{"apikey":SB_KEY,"Content-Type":"application/json"}, body:JSON.stringify(args)});
  if(!r.ok){
    /* Limites do banco (supabase-protecao.sql) chegam como "limite: ..." */
    let msg = "HTTP "+r.status;
    try{ const j = await r.json(); if(j && j.message) msg = j.message; }catch(e){}
    const err = new Error(msg); err.limit = /^limite:/.test(msg); throw err;
  }
  const body = await r.text(); return body ? JSON.parse(body) : null;
}
async function hashCode(c){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("english-practice:"+c));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function newCode(){
  const rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
  for(let i=0;i<5;i++){
    const c = [0,1,2,3].map(()=>WORDS[rnd(WORDS.length)]).join(" ");
    if(await rpc("create_session", {p_hash: await hashCode(c)})) return c;
  }
  throw new Error("não foi possível gerar um código");
}

const S = { lang:"en", code:null, hash:null, data:null, lesson:null, ex:0, tab:"ex", activeBlank:null, dirty:false };
let saveTimer=null, warned=false;
function persist(){
  if(!S.code) return;
  const all = loadAll(); all[S.code] = S.data; saveAll(all);
  S.dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(pushRemote, 700);
}
async function pushRemote(){
  if(!S.hash || !S.dirty) return;
  try{ await rpc("save_session", {p_hash:S.hash, p_data:S.data}); S.dirty=false; warned=false; }
  catch(e){ if(!warned){ toast(t("offlineSaved")); warned=true; } }
}
window.addEventListener("online", pushRemote);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") pushRemote(); });
function prog(lid, eid){
  S.data.progress[lid] = S.data.progress[lid] || {};
  return S.data.progress[lid][eid] = S.data.progress[lid][eid] || {answers:{}, checked:false};
}

/* ============================================================
   UTILIDADES
   ============================================================ */
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s||"").toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g," ").trim();
const normC = s => String(s||"").replace(/[’‘]/g,"'").replace(/\s+/g," ").trim();
/* Compara respostas; em exercícios com caseSensitive, maiúsculas e minúsculas contam. */
const same = (ex,a,b) => ex.caseSensitive ? normC(a)===normC(b) : norm(a)===norm(b);
const accepts = (ex,list,v) => list.some(a=>same(ex,a,v));
/* Texto bilíngue: aceita "texto" ou {pt:"...", en:"..."}. */
const tx = v => v==null ? "" : (typeof v==="string" ? v : (v[S.lang]||v.en||v.pt||""));
const isBi = v => v && typeof v==="object" && (v.pt||v.en);
/* Idiomas de conteúdo, na ordem do seletor. O idioma nativo padrão do aluno é o português. */
const LANG_ORDER = ["en","pt","es","it","fr"];
const langsOf = v => isBi(v) ? LANG_ORDER.filter(k=>v[k]) : [];
function lessonLang(l){
  const avail = langsOf(l.explanation), pr = S.data.prefs || {};
  const native = pr.native || "pt";
  const want = pr.lang || (/^A[12]/.test(l.level) ? native : "en");
  return avail.includes(want) ? want : (avail.includes(native) ? native : (avail[0] || "en"));
}
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("on"); clearTimeout(el._h); el._h=setTimeout(()=>el.classList.remove("on"),3200); }
function copyCode(){
  navigator.clipboard.writeText(S.code).then(()=>toast(t("copied")),()=>toast(t("copyFail")));
}
function exDone(lesson, ex){
  const p = (S.data.progress[lesson.id]||{})[ex.id]; if(!p) return false;
  if(ex.type==="mc") return ex.reveal==="end" ? !!p.checked : Object.keys(p.answers).length === (ex.items ? ex.items.length : ex.n);
  return p.checked;
}
function exScore(ex, p){
  if(ex.type==="mc"){ let c=0; ex.items.forEach((it,i)=>{ if(p.answers[i]===it.a) c++; }); return [c, ex.items.length]; }
  const keys = Object.keys(ex.answers); let c=0;
  keys.forEach(k=>{ if(accepts(ex, ex.answers[k], p.answers[k])) c++; });
  return [c, keys.length];
}

/* ============================================================
   TELAS
   ============================================================ */
function route(){
  closeSheet();
  if(!S.code){ renderGate(); return; }
  const h = location.hash.replace("#","");
  const meta = CATALOG.find(x=>x.id===h);
  if(!meta){ S.lesson=null; renderLibrary(); window.scrollTo(0,0); return; }
  const show = l => { if(location.hash.replace("#","")!==h) return; if(S.lesson!==l){ S.lesson=l; S.ex=0; S.tab="ex"; } renderLesson(); window.scrollTo(0,0); };
  if(LOADED[h]){ show(LOADED[h]); return; }
  setHeader();
  app.innerHTML = `<p class="muted center">${t("loadingLesson")}</p>`;
  loadLesson(meta).then(show).catch(()=>{
    app.innerHTML = `<div class="card center" style="max-width:520px;margin:24px auto"><p>${t("loadFail")}</p><div class="row" style="justify-content:center"><button class="btn" id="retry">${t("retry")}</button><button class="btn plain" id="bk2">${t("back")}</button></div></div>`;
    $("#retry").onclick = route; $("#bk2").onclick = () => { location.hash=""; };
  });
}
function setHeader(){
  const p = $("#codepill");
  if(S.code){ p.hidden=false; p.textContent="🔑 "+S.code; } else p.hidden=true;
}

function renderGate(msg){
  setHeader();
  app.innerHTML = `
  <div class="card" style="max-width:520px;margin:24px auto">
    <h1>${t("gateTitle")}</h1>
    <p class="muted">${t("gateSub")}</p>
    <h3>${t("haveCode")}</h3>
    <input class="code" id="codeIn" placeholder="${t("codePlaceholder")}" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="err" id="err">${msg||""}</div>
    <div class="row"><button class="btn" id="enter">${t("enter")}</button></div>
    <h3 style="margin-top:26px">${t("firstTime")}</h3>
    <button class="btn ghost" id="new">${t("generate")}</button>
    <p class="small muted" style="margin-top:22px">${t("anyDevice")}</p>
  </div>`;
  const busy = (on, label) => { ["#enter","#new"].forEach(id=>$(id).disabled=on); if(label) $("#err").textContent=label; };
  const go = async () => {
    const c = normCode($("#codeIn").value);
    if(c.split(" ").length!==4){ $("#err").textContent=t("codeWords"); return; }
    busy(true, t("entering"));
    const msg = await login(c);
    if(msg){ busy(false); $("#err").textContent = msg; }
  };
  $("#enter").onclick = go;
  $("#codeIn").onkeydown = e => { if(e.key==="Enter") go(); };
  $("#new").onclick = async () => {
    busy(true, t("generating"));
    try{ const c = await newCode(); await login(c, true); }
    catch(e){ busy(false); $("#err").textContent = e.limit ? t("noNewCodes") : t("serverDown"); }
  };
}

/* Devolve uma mensagem de erro, ou nada se entrou. */
async function login(c, isNew){
  const hash = await hashCode(c);
  let data;
  if(isNew){ data = {progress:{}}; }
  else {
    try{
      data = await rpc("get_session", {p_hash:hash});
      if(data===null) return t("codeNotFound");
    }catch(e){
      if(e.limit) return t("tooManyTries");
      const cached = loadAll()[c];
      if(!cached) return t("serverDown");
      data = cached; toast(t("offlineCached"));
    }
  }
  if(!data.progress) data.progress = {};
  S.code=c; S.hash=hash; S.data=data; setLast(c);
  const all=loadAll(); all[c]=data; saveAll(all);
  if(isNew) renderNewCode(); else route();
}

  app.querySelectorAll(".pg").forEach(b=> b.onclick=()=>{ S.ex=+b.dataset.i; closeSheet(); renderLesson(); window.scrollTo(0,0); });
  if(S.tab==="ex"){ ex.type==="mc" ? renderMC(l,ex) : renderGap(l,ex); }

/* ---------- Múltipla escolha por item ---------- */
/* Ordem embaralhada das alternativas; evita repetir a ordem anterior. */
function shuffledIdx(n, avoid){
  let a;
  for(let tries=0; tries<10; tries++){
    a = [...Array(n).keys()];
    for(let k=n-1;k>0;k--){ const r=new Uint32Array(1); crypto.getRandomValues(r); const m=r[0]%(k+1); [a[k],a[m]]=[a[m],a[k]]; }
    if(!avoid || a.join()!==avoid.join()) break;
  }
  return a;
}
function renderMC(l, ex){
  const p = prog(l.id, ex.id);
  const box = $("#exBody");
  const atEnd = ex.reveal==="end";   /* difícil: correção só no final, de uma vez */
  if(!Array.isArray(p.order) || p.order.length!==ex.items.length){
    const prev = p.prevOrder || [];
    p.order = ex.items.map((it,i)=>shuffledIdx(it.o.length, prev[i]));
    delete p.prevOrder; persist();
  }
  box.innerHTML = ex.items.map((it,i)=>{
    const ans = p.answers[i];
    const shown = atEnd ? p.checked : ans!==undefined;
    const q = esc(it.q).replace("___",'<b style="letter-spacing:2px">_____</b>');
    const opts = p.order[i].map((j,pos)=>{
      const o = it.o[j];
      let cls="opt";
      if(shown){ if(j===it.a) cls+=" right"; else if(j===ans) cls+=" wrong"; }
      else if(j===ans) cls+=" sel";
      return `<button class="${cls}" data-q="${i}" data-o="${j}" ${shown?"disabled":""}>${String.fromCharCode(97+pos)}) ${esc(o)}</button>`;
    }).join("");
    const why = shown ? `<div class="why ${ans===it.a?"ok":"no"}">${ans===it.a?`<b>${t("correct")}</b> `:""}${tx(it.why)}</div>` : "";
    return `<div class="q"><div><span class="qn">${i+1}</span>${q}</div><div class="opts">${opts}</div>${why}</div>`;
  }).join("") + mcSummary(ex,p);
  box.querySelectorAll(".opt").forEach(b=> b.onclick=()=>{
    const i=+b.dataset.q;
    if(atEnd){ if(p.checked) return; }
    else if(p.answers[i]!==undefined) return;
    p.answers[i]=+b.dataset.o; persist();
    const y = window.scrollY; renderLesson(); window.scrollTo(0,y);
  });
  const ck=$("#check"); if(ck) ck.onclick=()=>{
    const left = ex.items.length-Object.keys(p.answers).length;
    if(left>0) toast(left===1?t("missingItem1"):t("missingItemN",{n:left}));
    p.checked=true; persist(); renderLesson();
    const s=document.querySelector(".score"); if(s) s.scrollIntoView({behavior:"smooth",block:"center"});
  };
  wireReset(p);
}
/* Guarda a melhor nota de cada exercício (em %), que sobrevive ao "Refazer". Usada pela trilha. */
function recordBest(p, c, tot){
  const pct = tot ? Math.round(100*c/tot) : 0;
  if(!(p.best >= pct)){ p.best = pct; p.bestAt = new Date().toISOString().slice(0,10); persist(); }
}
function scoreBox(c,tt){
  const msg = c===tt ? t("perfect") : c>=tt*0.7 ? t("good") : t("retryExpl");
  return `<div class="score"><b>${c}/${tt}</b><span class="msg">${msg}</span><button class="btn plain" id="redo">${t("redo")}</button></div>`;
}
function mcSummary(ex,p){
  const n = Object.keys(p.answers).length, total = ex.items.length;
  if(ex.reveal==="end" && !p.checked)
    return `<div class="center"><p class="small muted">${t("answered",{n,total})}</p><button class="btn" id="check" ${n===0?"disabled":""}>${t("check")}</button></div>`;
  if(ex.reveal!=="end" && n<total) return `<p class="small muted center">${t("answered",{n,total})}</p>`;
  const [c,tot]=exScore(ex,p);
  recordBest(p, c, tot);
  return scoreBox(c,tot);
}

/* ---------- Preencher texto/diálogo com banco de opções ---------- */
function bankOf(ex){
  if(ex._bank) return ex._bank;
  if(ex.bank){ ex._bank = ex.bank.slice(); return ex._bank; }
  const set = new Set(); Object.values(ex.answers).forEach(a=>set.add(a[0]));
  const order=["up","down","in","out","by","on","off","over","away","back","around","through","along","apart"];
  if(ex.layout==="dialogue" || ![...set].every(w=>order.includes(w))){ ex._bank = [...set].sort((a,b)=>a.localeCompare(b)); }
  else { ex._bank=[...set].sort((a,b)=>order.indexOf(a)-order.indexOf(b)); }
  return ex._bank;
}
/* Opções da lacuna: as da própria lacuna (ex.opts[n], em ordem embaralhada e fixa) ou o banco geral. */
function optionsFor(ex, p, n){
  const own = ex.opts && ex.opts[n];
  if(!own) return bankOf(ex);
  p.optOrder = p.optOrder || {};
  if(!Array.isArray(p.optOrder[n]) || p.optOrder[n].length!==own.length){ p.optOrder[n] = shuffledIdx(own.length); persist(); }
  return p.optOrder[n].map(j=>own[j]);
}
function capIfStart(before, val){
  if(sheetCaseSensitive) return val;
  const plain = before.replace(/<[^>]*>/g,"").trim();
  if(plain==="" || /[.?!]$/.test(plain)) return val.charAt(0).toUpperCase()+val.slice(1);
  return val;
}
let sheetCaseSensitive = false;
function renderGap(l, ex){
  sheetCaseSensitive = !!ex.caseSensitive;
  const p = prog(l.id, ex.id);
  const box = $("#exBody");
  const blankHTML = (n, before) => {
    const v = p.answers[n]; const accepted = ex.answers[n];
    let cls="blank", inner;
    if(p.checked){
      const ok = accepts(ex, accepted, v);
      cls += ok ? " ok":" no";
      inner = ok ? `<span class="v">${esc(capIfStart(before, v))}</span>`
                 : `${v?`<span class="v">${esc(capIfStart(before,v))}</span>`:""}<span class="fix">${esc(capIfStart(before, accepted[0]))}</span>`;
    } else {
      if(S.activeBlank===n) cls+=" active";
      inner = `<span class="v">${v?esc(capIfStart(before,v)):"&nbsp;"}</span>`;
    }
    return `<button class="${cls}" data-n="${n}" ${p.checked?"disabled":""}><span class="n">${n}</span>${inner}</button>`;
  };
  const fill = text => {
    const parts = text.split(/\[\[(\d+)\]\]/); let out="", before="";
    parts.forEach((seg,i)=>{ if(i%2===0){ out+=esc(seg); before+=seg; } else { out+=blankHTML(+seg, before); before+="x"; } });
    return out;
  };
  let html = ex.scene ? `<div class="scene">${esc(tx(ex.scene))}</div>` : "";
  if(ex.layout==="dialogue"){
    html += `<div class="lines">${ex.lines.map(([sp,t])=>`<p><span class="sp">${esc(sp)}:</span> ${fill(t)}</p>`).join("")}</div>`;
  } else {
    html += `<div class="lines list">${ex.lines.map((t,i)=>`<p><span class="num">${i+1}.</span><span>${fill(t)}</span></p>`).join("")}</div>`;
  }
  const total = Object.keys(ex.answers).length, filled = Object.keys(ex.answers).filter(k=>p.answers[k]).length;
  if(!p.checked){
    html += `<div class="center"><p class="small muted">${t("filled",{n:filled,total})}</p><button class="btn" id="check" ${filled===0?"disabled":""}>${t("check")}</button></div>`;
  } else {
    const [c,tot] = exScore(ex,p);
    recordBest(p, c, tot);
    html += scoreBox(c,tot);
    html += `<div class="corr">${Object.keys(ex.answers).map(k=>{
      const acc=ex.answers[k], v=p.answers[k], ok=accepts(ex, acc, v);
      const alt = acc.length>1 ? ` <span class="muted small">(${t("also")}: ${esc(acc.slice(1).join(" / "))})</span>` : "";
      return `<div><span class="k ${ok?"ok":"no"}">${ok?"✓":"✗"} ${k}</span>${ok?"":`<s class="muted">${esc(v||"—")}</s> → `}<b>${esc(acc[0])}</b>${alt} — ${tx(ex.why[k])}</div>`;
    }).join("")}</div>`;
  }
  box.innerHTML = html;
  box.querySelectorAll(".blank").forEach(b=> b.onclick=()=> openSheet(l, ex, +b.dataset.n));
  const ck=$("#check"); if(ck) ck.onclick=()=>{
    if(filled<total){ toast(total-filled===1?t("missingBlank1"):t("missingBlankN",{n:total-filled})); }
    p.checked=true; persist(); closeSheet(); renderLesson();
    const s=document.querySelector(".score"); if(s) s.scrollIntoView({behavior:"smooth",block:"center"});
  };
  wireReset(p);
}

/* ---------- Apagar progresso do exercício ---------- */
function wireReset(p){
  const doReset = () => { p.answers={}; p.checked=false; delete p.optOrder; if(p.order){ p.prevOrder=p.order; delete p.order; } persist(); closeSheet(); renderLesson(); window.scrollTo(0,0); toast(t("erased")); };
  const r = $("#redo"); if(r) r.onclick = doReset;
  const bar = $("#resetbar"); if(!bar) return;
  const has = p.checked || Object.keys(p.answers).length>0;
  if(!has){ bar.innerHTML=""; return; }
  const idle = () => {
    bar.innerHTML = `<button class="linkbtn" id="rsAsk">${t("resetAsk")}</button>`;
    $("#rsAsk").onclick = () => {
      bar.innerHTML = `<span>${t("resetConfirm")}</span><button class="btn plain sm" id="rsNo">${t("cancel")}</button><button class="btn danger sm" id="rsYes">${t("erase")}</button>`;
      $("#rsNo").onclick = idle; $("#rsYes").onclick = doReset;
    };
  };
  idle();
}

/* ---------- Painel de opções ---------- */
let sheetCtx=null;
function openSheet(l, ex, n){
  sheetCtx={l,ex}; S.activeBlank=n;
  const p = prog(l.id, ex.id);
  $("#sheetTitle").textContent = t("blank",{n});
  $("#chips").innerHTML = optionsFor(ex, p, n).map(o=>`<button class="chip ${p.answers[n]!==undefined && same(ex,p.answers[n],o)?"sel":""}" data-v="${esc(o)}">${esc(o)}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(c=> c.onclick=()=> pick(c.dataset.v));
  $("#sheet").classList.add("open");
  refreshGap();
}
function pick(v){
  const {l,ex}=sheetCtx; const p=prog(l.id,ex.id);
  p.answers[S.activeBlank]=v; persist();
  const keys=Object.keys(ex.answers).map(Number);
  const next = keys.find(k=>k>S.activeBlank && !p.answers[k]) ?? keys.find(k=>!p.answers[k]);
  if(next!==undefined){ openSheet(l,ex,next); scrollToBlank(next); } else { closeSheet(); refreshGap(); }
}
function scrollToBlank(n){
  const b=document.querySelector(`.blank[data-n="${n}"]`); if(!b) return;
  const r=b.getBoundingClientRect(), sh=$("#sheet").getBoundingClientRect().height;
  if(r.bottom > window.innerHeight - sh - 20 || r.top < 70) window.scrollBy({top: r.top - 140, behavior:"smooth"});
}
function refreshGap(){ const y=window.scrollY; if(S.lesson && S.tab==="ex"){ renderLesson(); window.scrollTo(0,y); } }
function closeSheet(){ $("#sheet").classList.remove("open"); S.activeBlank=null; }
$("#sheetClose").onclick=()=>{ closeSheet(); refreshGap(); };
$("#sheetClear").onclick=()=>{ if(!sheetCtx) return; const p=prog(sheetCtx.l.id,sheetCtx.ex.id); delete p.answers[S.activeBlank]; persist(); openSheet(sheetCtx.l,sheetCtx.ex,S.activeBlank); };

  $("#cp").onclick=copyCode;
