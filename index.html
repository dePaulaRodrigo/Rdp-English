<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>English Practice</title>
<link rel="preload" href="fonts/lexend-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Lexend (SIL Open Font License, fonts/OFL-Lexend.txt), hospedada no próprio site: nenhum dado do aluno vai para terceiros. */
@font-face{font-family:Lexend;font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/lexend-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Lexend;font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/lexend-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  --bg:#eae5e2; --card:#ffffff; --ink:#000000; --muted:#5b5852; --line:#d9d2cc;
  --soft:#f4f1ef; --chip:#ece7e3; --field:#fbfaf9; --optline:#c9c1bb;
  --primary:#000000; --on-primary:#ffffff; --brand:#985734; --focus:#2b6a94;
  --sel:#70b3de; --sel-soft:#d4e8f5;
  --ok:#2f6f45; --ok-soft:#e4efe6; --bad:#b42318; --bad-soft:#f7e3e0; --on-bad:#ffffff; --warn-soft:#f6ecd2;
  --top:#000000; --on-top:#ffffff; --shadow:rgba(0,0,0,.10); --art-dim:transparent;
  --r:14px;
}
:root[data-theme="dark"]{
  --bg:#141312; --card:#1f1f1f; --ink:#eae5e2; --muted:#a8a29d; --line:#33302d;
  --soft:#272523; --chip:#2e2b29; --field:#191817; --optline:#4a4643;
  --primary:#eae5e2; --on-primary:#000000; --brand:#c98a5e; --focus:#70b3de;
  --sel:#70b3de; --sel-soft:#1e3442;
  --ok:#7bc795; --ok-soft:#1c3324; --bad:#f0938a; --bad-soft:#3b1d1a; --on-bad:#000000; --warn-soft:#3a3120;
  --top:#1f1f1f; --on-top:#eae5e2; --shadow:rgba(0,0,0,.5); --art-dim:rgba(20,19,18,.72);
}
*{box-sizing:border-box}
h1,h2,h3,b,strong,th{font-weight:600}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Lexend,system-ui,sans-serif;font-size:17px;line-height:1.55}
html{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
button{font:inherit;cursor:pointer;color:inherit;-webkit-text-fill-color:currentColor}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--top);color:var(--on-top);border-bottom:1px solid var(--line)}
.top .in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{white-space:nowrap;font-weight:600;letter-spacing:-.01em;font-size:18px;cursor:pointer;display:flex;align-items:center;gap:8px}
.brand .dot{width:22px;height:22px;border-radius:7px;background:#985734;color:#fff;display:grid;place-items:center;font-size:13px}
.spacer{flex:1}
.codepill{font-size:13px;background:rgba(255,255,255,.12);border:0;color:var(--on-top);padding:6px 10px;border-radius:999px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.themebtn{flex:none;width:34px;height:34px;border:0;border-radius:999px;background:rgba(255,255,255,.12);color:var(--on-top);display:grid;place-items:center;padding:0}
.themebtn svg{width:18px;height:18px}
main{max-width:820px;margin:0 auto;padding:20px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
h1{font-size:28px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:21px;margin:0 0 8px;letter-spacing:-.01em}
h3{font-size:17px;margin:18px 0 8px}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:600;background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.plain{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input.code{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--optline);border-radius:10px;background:var(--field);color:var(--ink)}
input.code:focus{outline:2px solid var(--focus);border-color:transparent}
.bigcode{font-size:22px;font-weight:600;letter-spacing:.01em;background:var(--sel-soft);color:var(--ink);padding:14px 16px;border-radius:12px;word-spacing:6px;text-align:center}
.note{background:var(--warn-soft);border-radius:10px;padding:10px 14px;font-size:14px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
/* library */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:16px}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .12s, box-shadow .12s}
.lcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px var(--shadow)}
.lcard .art{height:96px;display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:inset 0 0 0 999px var(--art-dim)}
.lcard .body{padding:14px 16px 16px}
.lcard .t{font-weight:600;font-size:17px;line-height:1.3}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--ink)}
.tag.lv{background:var(--primary);color:var(--on-primary)}
.bar{height:6px;border-radius:9px;background:var(--chip);margin-top:12px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sel)}
/* lesson */
.crumb{font-size:14px;color:var(--muted);margin-bottom:8px}
.crumb a{color:var(--ink);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 0}
.tab{white-space:nowrap;border:1px solid var(--line);border-bottom:0;background:var(--soft);padding:10px 16px;border-radius:12px 12px 0 0;font-weight:600;color:var(--muted)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:inset 0 3px 0 var(--brand)}
.panel{border-top-left-radius:0}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.pg{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;position:relative}
.pg.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.pg.done::after{content:"";position:absolute;right:-3px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--card)}
.instr{background:var(--soft);border-radius:10px;padding:12px 14px;margin:12px 0 18px;font-size:15px}
/* MC */
.q{padding:16px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.qn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:13px;font-weight:600;margin-right:8px;vertical-align:1px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--optline);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;text-align:left;font-size:16px;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--sel)}
.opt:disabled{cursor:default;color:var(--muted);opacity:1}
.opt.sel{border-color:var(--sel);background:var(--sel-soft);color:var(--ink);font-weight:600}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.why{margin-top:10px;font-size:14.5px;padding:9px 12px;border-radius:9px}
.why.ok{background:var(--ok-soft)} .why.no{background:var(--bad-soft)}
/* gap */
.lines p{margin:0 0 10px}
.lines.list p{display:flex;gap:10px}
.lines.list .num{color:var(--muted);font-weight:600;min-width:22px}
.sp{font-weight:600}
.scene{font-style:italic;color:var(--muted);font-size:15px;margin-bottom:14px}
.blank{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:0;margin:0 2px;vertical-align:baseline}
.blank .n{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:12px;font-weight:600;padding:0 5px}
.blank .v{display:inline-block;min-width:92px;border-bottom:2px solid var(--optline);padding:0 4px;font-weight:600;color:var(--ink);text-align:left}
.blank.active .v{border-color:var(--sel);background:var(--sel-soft);border-radius:5px 5px 0 0}
.blank.ok .v{color:var(--ok);border-color:var(--ok)}
.blank.no .v{color:var(--bad);border-color:var(--bad);text-decoration:line-through}
.blank.rev .v{color:var(--ok);border-color:var(--ok);border-bottom-style:dashed;font-style:italic}
.revealbar{display:flex;justify-content:flex-end;margin-top:10px}
/* resposta digitada */
.blank.typed{cursor:text}
.tin{font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--field);border:0;border-bottom:2px solid var(--optline);border-radius:5px 5px 0 0;padding:1px 6px;min-width:6ch;max-width:100%}
.tin:focus{outline:none;border-color:var(--sel);background:var(--sel-soft)}
.hint{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--muted);margin-left:4px}
.lines.text p{margin:0 0 12px;line-height:2}
.tf{padding:10px 0 12px;border-top:1px solid var(--line)}
.tf:first-child{border-top:0;padding-top:0}
.tf .src{margin:0 0 6px}
.tf .key{margin:0 0 6px;font-weight:600;letter-spacing:.06em}
.tf .tgt{margin:0;line-height:2}
.blank:disabled{cursor:default}
.center{text-align:center;margin-top:22px}
.score{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--sel-soft);border-radius:12px;padding:14px 16px;margin-top:20px}
.score b{font-size:26px;color:var(--ink)}
.score .msg{flex:1 1 170px}
.score .btn{margin-left:auto}
.corr{margin-top:16px;font-size:15px}
.corr div{padding:8px 0;border-top:1px solid var(--line)}
.corr .k{font-weight:600;margin-right:6px}
.corr .ok{color:var(--ok)} .corr .no{color:var(--bad)}
/* áudio */
.play{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);font-size:12px;font-weight:600;padding:0;margin-right:8px;vertical-align:middle;flex:none}
.play.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.lines p.au{display:flex;align-items:flex-start;gap:0}
.lines p.au .play{margin-top:-3px}
.lines p.au.on{background:var(--sel-soft);border-radius:8px}
.playall{margin:0 0 14px}
/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 24px var(--shadow);transform:translateY(110%);transition:transform .18s}
.sheet.open{transform:none}
.sheet:not(.open){box-shadow:none;visibility:hidden;transition:transform .18s, visibility 0s .18s}
.sheet .in{max-width:820px;margin:0 auto;padding:12px 16px 18px}
.sheet .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-height:38vh;overflow:auto}
.chip{border:1.5px solid var(--optline);background:var(--field);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:15.5px;font-weight:600}
.chip:hover{border-color:var(--sel)}
.chip.sel{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.x{border:0;background:var(--chip);color:var(--ink);border-radius:8px;padding:6px 10px;font-weight:600}
/* explanation */
.expl{overflow-x:auto}
.expl h2{font-size:24px}
.expl h3{font-size:19px;margin:24px 0 8px}
.expl table.countries tr.c td{background:var(--soft);font-weight:600;border-bottom:0}
.expl table{width:100%;border-collapse:collapse;margin:8px 0 18px;font-size:15px}
.expl th,.expl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.expl th{background:var(--soft)}
.expl table.ptable td:nth-child(3){white-space:nowrap}
@media (min-width:600px){.expl table.ptable td:nth-child(-n+2),.expl table.ptable th:nth-child(-n+2){white-space:nowrap;width:1%}.expl table.ptable td:nth-child(2),.expl table.ptable th:nth-child(2){padding-right:28px}}
.expl ul{padding-left:20px}
.resetbar{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;align-items:center;margin:-6px 0 14px;font-size:14.5px;min-height:8px}
.linkbtn{border:0;background:none;color:var(--bad);font-weight:600;padding:6px 2px}
.linkbtn.about{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.btn.sm{padding:8px 14px;font-size:14.5px}
.btn.danger{background:var(--bad);color:var(--on-bad)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--primary);color:var(--on-primary);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.on{opacity:1}
h2.area{margin:28px 0 12px}
.welcome{margin:8px 0 18px}
.welcome h1{margin-top:0}
.welcome p{margin:0 0 8px}
.foot{max-width:860px;margin:8px auto 28px;padding:0 16px;display:flex;justify-content:center;flex-wrap:wrap;gap:6px 22px;font-size:14px}
.foot a{color:var(--muted);text-underline-offset:2px}
.legal h2{margin-top:26px}
.cur{max-width:860px;margin:18px auto}
.cur .sec{margin-top:18px}
.cur .sec h2{display:flex;gap:10px;align-items:center;margin:0 0 6px}
.cur .how{background:var(--bg);border-left:3px solid var(--brand);padding:8px 12px;border-radius:6px;font-size:15px}
.cur ul{list-style:none;padding:0;margin:12px 0 0}
.cur li{padding:10px 0;border-top:1px solid var(--line)}
.cur li:first-child{border-top:0}
.cur .lv{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);margin-left:6px;white-space:nowrap}
.cur a.nm{font-weight:700}
.legal li{margin-bottom:6px}
.hometabs{display:flex;gap:6px;margin:6px 0 4px;border-bottom:1px solid var(--line)}
.hometabs button{border:0;background:transparent;padding:10px 14px;font-size:16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.hometabs button.on{color:var(--ink);border-color:var(--brand)}
.homesub{margin:14px 0 4px}
.sortbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0 6px}
.sortbar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.sortbar button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.lvhead{margin:22px 0 10px;font-size:20px}
.lcard .art.soon{filter:grayscale(.6);opacity:.75}
.metarow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.langsw{display:flex;margin-left:auto;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langsw button{border:0;background:transparent;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.langsw button.on{background:var(--primary);color:var(--on-primary)}
/* trilha */
.tag.okt{background:var(--ok-soft);color:var(--ok)}
.trailcard{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:16px 18px;margin:0 0 14px}
.tc-lv{display:flex;flex-direction:column;align-items:center;min-width:64px}
.tc-lv b{font-size:26px;line-height:1.1}
.tc-next{flex:1 1 200px;min-width:0}
.tc-t{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tc-act{display:flex;gap:8px;flex-wrap:wrap}
.lvtop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.biglv{font-size:40px;font-weight:600;line-height:1.1}
.lvpick{display:flex;align-items:center;gap:8px}
.lvpick select{font:inherit;font-size:15px;padding:6px 10px;border:1.5px solid var(--optline);border-radius:9px;background:var(--field);color:var(--ink)}
.lvrow{padding:10px 0;border-top:1px solid var(--line)}
.lvrow:first-child{border-top:0;padding-top:0}
.lvrow:last-child{padding-bottom:0}
.lvh{display:flex;align-items:center;gap:8px}
.lvrow .bar{margin-top:8px}
.lvrow.on .bar>i{background:var(--brand)}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin-top:8px}
.prow:hover{border-color:var(--sel)}
.prow .pi{font-size:24px;flex:none}
.prow .pt{flex:1;display:flex;flex-direction:column;min-width:0}
.behind{margin-top:14px}
.behind summary{cursor:pointer;font-weight:600;font-size:15px}
@media (max-width:520px){.expl table{font-size:14px}.expl th,.expl td{padding:6px 7px}}
@media (max-width:380px){.expl table{font-size:13px}.expl th,.expl td{padding:5px 5px}}
@media (max-width:520px){.tabs{gap:4px}.tab{padding:9px 11px;font-size:15px}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand" id="brand"><span class="dot">✓</span>English Practice</div>
  <div class="spacer"></div>
  <button class="codepill" id="codepill" hidden></button>
  <button class="themebtn" id="themeBtn" type="button"></button>
</div></header>
<main id="app"></main>
<footer class="foot"><a href="#conteudo">Conteúdo em inglês</a><a href="#privacidade">Privacidade e termos de uso</a></footer>
<div class="sheet" id="sheet"><div class="in">
  <div class="hd"><span id="sheetTitle"></span><span class="spacer"></span><button class="x" id="sheetClear"></button><button class="x" id="sheetClose"></button></div>
  <div class="chips" id="chips"></div>
</div></div>
<div class="toast" id="toast"></div>

<script src="lessons/catalog.js"></script>
<script src="curated.js"></script>
<script>
/* ============================================================
   TEXTOS DA INTERFACE
   Para acrescentar um idioma: copie o bloco "pt", traduza e acrescente o código em UI_LANGS.
   ============================================================ */
const UI_LANGS = ["pt"];
const UI = { pt:{
  loading:"Carregando…", loadingLesson:"Carregando a lição…",
  loadFail:"Não foi possível carregar a lição. Verifique a conexão com a internet.", retry:"Tentar novamente", back:"Voltar",
  gateTitle:"Pratique inglês com o seu código", gateSub:"Sem login e sem senha. Seu código guarda o seu progresso.",
  haveCode:"Já tem um código?", codePlaceholder:"ex.: piano tiger orbit honey", enter:"Entrar", entering:"Entrando…",
  firstTime:"Primeira vez?", generate:"Gerar meu código", generating:"Gerando…", anyDevice:"O mesmo código funciona em qualquer aparelho. Em computadores compartilhados, toque em Sair ao terminar.",
  codeWords:"O código tem 4 palavras.", codeNotFound:"Código não encontrado. Confira as 4 palavras.",
  serverDown:"Sem conexão com o servidor. Tente novamente em instantes.",
  tooManyTries:"Muitas tentativas com códigos inexistentes a partir desta conexão. Aguarde uma hora e tente novamente.",
  noNewCodes:"Não é possível gerar códigos novos neste momento. Tente novamente mais tarde.",
  offlineCached:"Sem conexão. Usando o progresso salvo neste aparelho.",

const BAD_KEYS = new Set(["__proto__","constructor","prototype"]);
const isObj = v => v!==null && typeof v==="object" && !Array.isArray(v);
/* Garante a estrutura esperada, mesmo que os dados venham corrompidos ou adulterados. */
function sanitize(d){
  const out = {progress:{}};
  if(!isObj(d)) return out;
  if(isObj(d.prefs)){
    out.prefs = {};
    for(const k of ["lang","native","ui","theme","sort"]) if(typeof d.prefs[k]==="string" && d.prefs[k].length<=8) out.prefs[k]=d.prefs[k];
    if(typeof d.prefs.t==="number") out.prefs.t = d.prefs.t;
    if(d.prefs.noStats===true) out.prefs.noStats = true;
  }
  if(isObj(d.progress)) for(const lid of Object.keys(d.progress)){
    if(BAD_KEYS.has(lid) || !isObj(d.progress[lid])) continue;
    for(const eid of Object.keys(d.progress[lid])){
      const e = d.progress[lid][eid];
      if(BAD_KEYS.has(eid) || !isObj(e)) continue;
      const c = {answers:{}, checked: e.checked===true};
      if(isObj(e.answers)) for(const k of Object.keys(e.answers)){
        const v = e.answers[k];
        if(!BAD_KEYS.has(k) && (typeof v==="number" || (typeof v==="string" && v.length<=200))) c.answers[k]=v;
      }
      if(Array.isArray(e.order)) c.order = e.order;
      if(Array.isArray(e.prevOrder)) c.prevOrder = e.prevOrder;
      if(isObj(e.optOrder)) c.optOrder = e.optOrder;
      if(typeof e.best==="number" && e.best>=0 && e.best<=100){ c.best = e.best; if(typeof e.bestAt==="string") c.bestAt = e.bestAt.slice(0,10); }
      if(typeof e.t==="number") c.t = e.t;
      if(Number.isInteger(e.rev)) c.rev = e.rev;
      (out.progress[lid] = out.progress[lid] || {})[eid] = c;
    }
  }
  const lv = cleanLevels(d.levels); if(lv) out.levels = lv;
  return out;
}
/* ---------- Níveis do aluno (preparado para o teste de nivelamento e a trilha) ----------
   levels.start: nível inicial (primeiro resultado do teste de nivelamento; não muda depois).
   levels.cur:   nível atual (último teste refeito ou avanço na trilha).
   levels.hist:  histórico de mudanças, para medir o tempo entre um nível e outro (até 30 registros).
   Cada registro: {l:"A2", at:"AAAA-MM-DD", src:"test"|"trail"|"choice", t: hora em ms}. Ficam nos dados do código, como o progresso.
   "choice": o aluno escolheu o nível na tela de Progressão. O nível inicial (start) só vem do teste de nivelamento. */
const CEFR = ["A1","A2","B1","B2","C1","C2"];
function cleanLvl(e){
  if(!isObj(e) || !CEFR.includes(e.l) || typeof e.at!=="string" || !/^\d{4}-\d{2}-\d{2}$/.test(e.at)) return null;
  const o = {l:e.l, at:e.at}; if(e.src==="test" || e.src==="trail" || e.src==="choice") o.src = e.src;
  if(typeof e.t==="number" && e.t>0) o.t = e.t;
  return o;
}
function cleanLevels(v){
  if(!isObj(v)) return null;
  const o = {}, st = cleanLvl(v.start), cu = cleanLvl(v.cur);
  if(st) o.start = st; if(cu) o.cur = cu;
  if(Array.isArray(v.hist)) o.hist = v.hist.map(cleanLvl).filter(Boolean).slice(-30);
  return Object.keys(o).length ? o : null;
}
function mergeLevels(a, b){
  if(!a) return b; if(!b) return a;
  const o = {};
  const st = [a.start, b.start].filter(Boolean).sort((x,y)=>x.at.localeCompare(y.at));
  const cu = [a.cur, b.cur].filter(Boolean).sort((x,y)=>y.at.localeCompare(x.at) || (y.t||0)-(x.t||0));
  if(st.length) o.start = st[0]; if(cu.length) o.cur = cu[0];
  const seen = new Set(), h = [];
  [...(a.hist||[]), ...(b.hist||[])].sort((x,y)=>x.at.localeCompare(y.at)).forEach(e=>{ const k=e.l+e.at+(e.src||""); if(!seen.has(k)){ seen.add(k); h.push(e); } });
  if(h.length) o.hist = h.slice(-30);
  return o;
}
/* A chamar pelo teste de nivelamento (src "test") ou pela trilha (src "trail"). */
function setLevel(l, src){
  if(!CEFR.includes(l) || !S.data) return;
  const e = {l, at: new Date().toISOString().slice(0,10), src, t: Date.now()};
  const lv = S.data.levels = S.data.levels || {};
  if(!lv.start && src==="test") lv.start = e;
  lv.cur = e;
  lv.hist = (lv.hist||[]).concat(e).slice(-30);
  persist();
}
/* Junta dois estados: em cada exercício vale a versão alterada por último; a melhor nota é a maior das duas. */
function merge(a, b){
  a = sanitize(a); b = sanitize(b);
  const out = sanitize(a);
  for(const lid of Object.keys(b.progress)) for(const eid of Object.keys(b.progress[lid])){
    const x = (out.progress[lid]||{})[eid], y = b.progress[lid][eid];
    const pick = !x || (y.t||0) > (x.t||0) ? y : x;
    const best = Math.max(x && x.best>=0 ? x.best : -1, y.best>=0 ? y.best : -1);
    const merged = Object.assign({}, pick);
    if(best>=0){ merged.best = best; merged.bestAt = ((x && x.best===best) ? x.bestAt : y.bestAt) || pick.bestAt; }
    (out.progress[lid] = out.progress[lid] || {})[eid] = merged;
  }
  if(b.prefs && (!out.prefs || (b.prefs.t||0) > (out.prefs.t||0))) out.prefs = b.prefs;
  const lv = mergeLevels(out.levels, b.levels); if(lv) out.levels = lv;
  return out;
}
/* Envia ao servidor: lê o que está lá, junta com o local e grava o resultado.
   Assim, progresso feito em outro aparelho ou outra aba não é sobrescrito.
   Os dados locais (S.data) não são trocados aqui: as telas abertas guardam referências a eles.
   O progresso vindo de outro aparelho entra no próximo login. */
function pushRemote(leaving){
  if(!S.hash || !S.dirty) return Promise.resolve(true);
  if(pushing) return pushing.then(()=>pushRemote(leaving));
  const hash = S.hash, rev = S.rev;
  pushing = (async()=>{
    try{
      const server = await rpc("get_session", {p_hash:hash});
      const data = server===null ? S.data : merge(server, S.data);
      let ok = await rpc("save_session", {p_hash:hash, p_data:data}, leaving);
      if(!ok){ await rpc("create_session", {p_hash:hash}); ok = await rpc("save_session", {p_hash:hash, p_data:data}, leaving); }
      if(!ok) throw new Error("save");
      if(S.hash===hash && S.rev===rev){ S.dirty = false; localPut(hash, S.data, false); }
      warned = false; return true;
    }catch(e){
      if(!warned){ toast(e.limit ? t("saveRejected") : t("offlineSaved")); warned = true; }
      return false;
    }finally{ pushing = null; }
  })();
  return pushing;
}

/* Exercício reformulado (campo rev): respostas antigas não valem para os itens novos. A melhor nota fica. */
function progEx(l, ex){

  if((p.rev||0)!==r){

}

const isBi = v => v && typeof v==="object" && (v.pt||v.en);
/* Idiomas de conteúdo, na ordem do seletor. O idioma nativo padrão do aluno é o português. */
const LANG_ORDER = ["en","pt","es","it","fr"];
const langsOf = v => isBi(v) ? LANG_ORDER.filter(k=>v[k]) : [];
function lessonLang(l){
  const avail = langsOf(l.explanation), pr = S.data.prefs || {};
  const native = pr.native || "pt";
  const want = pr.lang || (/^A[12]/.test(l.level) ? native : "en");
  return avail.includes(want) ? want : (avail.includes(native) ? native : (avail[0] || "en"));
}

const player = { el:null, btn:null, queue:null };
function stopAudio(){
  if(player.el){ player.el.pause(); player.el.onended=null; }
  document.querySelectorAll(".play.on, .lines p.au.on").forEach(e=>e.classList.remove("on"));
  const pa = $("#playAll"); if(pa) pa.textContent = t("playAll");
  player.btn = null; player.queue = null;
}
function playFile(src, btn, done){
  if(!player.el) player.el = new Audio();
  const a = player.el; a.onended = null; a.pause();
  document.querySelectorAll(".play.on, .lines p.au.on").forEach(e=>e.classList.remove("on"));
  player.btn = btn; if(btn){ btn.classList.add("on"); const row = btn.closest("p.au"); if(row) row.classList.add("on"); }
  a.src = src;
  a.onended = () => { if(btn){ btn.classList.remove("on"); const row = btn.closest("p.au"); if(row) row.classList.remove("on"); } player.btn=null; if(done) done(); };
  a.play().catch(()=>{ toast(t("audioFail")); stopAudio(); });
}
function wirePlay(root, l, ex){
  root.querySelectorAll(".play").forEach(b=> b.onclick = e => {
    e.stopPropagation();
    if(player.btn===b){ stopAudio(); return; }
    player.queue = null; const pa = $("#playAll"); if(pa) pa.textContent = t("playAll");
    track("audio",{l:l.id, x:ex.id, i:+b.dataset.au});
    playFile(`audio/${l.id}/${ex.id}-${b.dataset.au}.mp3`, b);
  });
  const pa = $("#playAll"); if(pa) pa.onclick = () => {
    if(player.queue){ stopAudio(); return; }
    const btns = [...root.querySelectorAll(".lines .play")]; let i = 0;
    player.queue = true; pa.textContent = t("stopAll");
    const next = () => { if(!player.queue || i>=btns.length){ stopAudio(); return; } const b = btns[i++]; b.scrollIntoView({block:"nearest",behavior:"smooth"}); playFile(`audio/${l.id}/${ex.id}-${b.dataset.au}.mp3`, b, next); };
    next();
  };
}
const playBtn = n => `<button class="play" data-au="${n}" title="${t("listen")}" aria-label="${t("listen")}">▶</button>`;
function exDone(lesson, ex){
  const p = (S.data.progress[lesson.id]||{})[ex.id]; if(!p) return false;
  if(ex.type==="mc") return ex.reveal==="end" ? !!p.checked : Object.keys(p.answers).length === (ex.items ? ex.items.length : ex.n);
  return p.checked;
}
function exScore(ex, p){
  if(ex.type==="mc"){ let c=0; ex.items.forEach((it,i)=>{ if(p.answers[i]===it.a) c++; }); return [c, ex.items.length]; }
  const keys = Object.keys(ex.answers); let c=0;
  keys.forEach(k=>{ if(accepts(ex, ex.answers[k], p.answers[k])) c++; });
  return [c, keys.length];
}

/* ============================================================
   TRILHA
   Lição concluída: todos os exercícios visíveis (os do catálogo) com melhor nota de pelo menos 70%.
   Os exercícios de escuta só entram no catálogo quando todos os áudios existem; a partir daí, contam.
   Subida de nível: 80% das lições do Inglês Cotidiano do nível atual concluídas (C2: 80% do C1 e todas as C2).
   O nível nunca desce sozinho. A trilha sugere, nunca trava.
   ============================================================ */
const PASS = 70, LEVEL_UP = 0.8;
const trailLessons = () => CATALOG.filter(l=>l.area==="Inglês Cotidiano");
const byBook = (a,b) => (a.part||0)-(b.part||0) || (a.order||0)-(b.order||0);
/* m: resumo da lição no catálogo */
function lessonState(m){
  const pr = (S.data.progress||{})[m.id] || {};
  const bests = m.exercises.map(e => { const p = pr[e.id]; return p && p.best>=0 ? p.best : -1; });
  const passed = bests.filter(b=>b>=PASS).length;
  const started = m.exercises.some(e => { const p = pr[e.id]; return p && (p.best>=0 || Object.keys(p.answers||{}).length>0); });
  return {done: bests.length>0 && passed===bests.length, started, passed, total: bests.length};
}
const curLevel = () => (S.data.levels && S.data.levels.cur && S.data.levels.cur.l) || "A1";
function levelInfo(lv){
  const ls = trailLessons().filter(l=>l.level===lv);
  const done = ls.filter(l=>lessonState(l).done).length;
  return {ls, done, total: ls.length, need: Math.ceil(LEVEL_UP*ls.length - 1e-9)};
}
function levelPassed(lv){
  const i = levelInfo(lv);
  if(!i.total || i.done < i.need) return false;
  if(lv==="C1") return trailLessons().filter(l=>l.level==="C2").every(l=>lessonState(l).done);
  return true;
}
/* Sobe o nível quantas vezes a regra permitir (um registro por nível). Devolve o novo nível, ou nada. */
function checkTrail(){
  if(!S.data) return null;
  let cur = curLevel(), up = null;
  while(CEFR.indexOf(cur) < CEFR.length-1 && levelPassed(cur)){ cur = CEFR[CEFR.indexOf(cur)+1]; setLevel(cur, "trail"); up = cur; }
  return up;
}
/* Próximo passo: lição começada e não concluída do nível atual; senão, a primeira não concluída do nível atual
   na ordem do ebook; senão, a primeira não concluída dos níveis seguintes. */
/* Próxima lição recomendada: a primeira ainda não começada do nível atual, na ordem do ebook;
   depois, as dos níveis seguintes; por fim, as de níveis anteriores. */
function recommended(){
  const ci = CEFR.indexOf(curLevel());
  const fresh = trailLessons().slice().sort(byBook).filter(l=>{ const s = lessonState(l); return !s.done && !s.started; });
  const rank = l => { const d = CEFR.indexOf(l.level) - ci; return d===0 ? 0 : d>0 ? d : 10-d; };
  return fresh.sort((a,b)=> rank(a)-rank(b) || byBook(a,b))[0] || null;
}
function nextStep(){
  const all = trailLessons().slice().sort(byBook), ci = CEFR.indexOf(curLevel());
  const open = all.filter(l=>!lessonState(l).done);
  const here = open.filter(l=>l.level===curLevel());
  return here.find(l=>lessonState(l).started) || here[0] || open.find(l=>CEFR.indexOf(l.level)>ci) || null;
}

function route(){
  closeSheet(); stopAudio();
  const h = location.hash.replace("#","");
  /* lições unidas: o endereço antigo leva à lição nova */
  const MERGED = {"going-to":"will"};
  if(MERGED[h]){ location.replace("#"+MERGED[h]); return; }
  if(h==="privacidade"){ renderPrivacy(); window.scrollTo(0,0); return; }
  if(h==="conteudo"){ if(S.code) track("home",{d:"content"}); renderContent(); window.scrollTo(0,0); return; }
  if(!S.code){ renderGate(); return; }
  if(h==="nao-contar" || h==="contar"){
    const on = h==="nao-contar";
    S.data.prefs = Object.assign({}, S.data.prefs);
    if(on){ S.data.prefs.noStats = true; STQ.length = 0; } else delete S.data.prefs.noStats;
    persist(S.data.prefs); toast(t(on?"noStatsOn":"noStatsOff")); location.hash = ""; return;
  }
  if(h==="progressao"){ S.lesson=null; S.exKey=null; track("home",{d:"progress"}); renderProgress(); window.scrollTo(0,0); return; }
  if(h.startsWith("area/")){ const f = fieldOf(h.slice(5)); if(f){ S.lesson=null; S.exKey=null; track("area",{d:f.id}); renderField(f); window.scrollTo(0,0); return; } }
  const meta = CATALOG.find(x=>x.id===h);
  if(!meta){ S.lesson=null; S.exKey=null; track("home",{d:S.home||"daily"}); renderLibrary(); window.scrollTo(0,0); return; }
  const show = l => { if(location.hash.replace("#","")!==h) return; if(S.lesson!==l){ S.lesson=l; S.ex=0; S.tab="ex"; S.exKey=null; S.lang=lessonLang(l); track("lesson",{l:l.id}); track("tab",{l:l.id, d:"ex"}); } renderLesson(); window.scrollTo(0,0); };
  if(LOADED[h]){ show(LOADED[h]); return; }
  setHeader();
  app.innerHTML = `<p class="muted center">${t("loadingLesson")}</p>`;
  loadLesson(meta).then(show).catch(()=>{
    app.innerHTML = `<div class="card center" style="max-width:520px;margin:24px auto"><p>${t("loadFail")}</p><div class="row" style="justify-content:center"><button class="btn" id="retry">${t("retry")}</button><button class="btn plain" id="bk2">${t("back")}</button></div></div>`;
    $("#retry").onclick = route; $("#bk2").onclick = () => { location.hash=""; };
  });
}

/* Devolve uma mensagem de erro, ou nada se entrou. */
async function login(c, isNew){
  const hash = await hashCode(c);
  const local = localGet(hash);
  let data, dirty = false;
  if(isNew){ data = {progress:{}}; }
  else {
    try{
      const server = await rpc("get_session", {p_hash:hash});
      if(server===null && !(local && local.dirty)) return t("codeNotFound");
      /* Progresso feito sem internet neste aparelho e ainda não enviado: junta com o do servidor. */
      if(local && local.dirty){ data = server===null ? sanitize(local.d) : merge(server, local.d); dirty = true; }
      else data = sanitize(server);
    }catch(e){
      if(e.limit) return t("tooManyTries");
      if(!local) return t("serverDown");
      data = sanitize(local.d); dirty = !!local.dirty; toast(t("offlineCached"));
    }
  }
  S.code=c; S.hash=hash; S.data=data; S.dirty=dirty; setLast(c);
  applyTheme(true);
  if(noStats()) STQ.length = 0;   /* descarta a abertura do site, registrada antes da entrada */
  localPut(hash, data, dirty);
  if(dirty) pushRemote();
  if(isNew) renderNewCode(); else route();
}

/* ---------- Múltipla escolha por item ---------- */
/* Ordem embaralhada das alternativas; evita repetir a ordem anterior. */
function shuffledIdx(n, avoid){
  let a;
  for(let tries=0; tries<10; tries++){
    a = [...Array(n).keys()];
    for(let k=n-1;k>0;k--){ const r=new Uint32Array(1); crypto.getRandomValues(r); const m=r[0]%(k+1); [a[k],a[m]]=[a[m],a[k]]; }
    if(!avoid || a.join()!==avoid.join()) break;
  }
  return a;
}
function renderMC(l, ex){
  const p = progEx(l, ex);
  const box = $("#exBody");
  const atEnd = ex.reveal==="end";   /* difícil: correção só no final, de uma vez */
  if(!Array.isArray(p.order) || p.order.length!==ex.items.length || p.order.some((o,i)=>!Array.isArray(o) || o.length!==ex.items[i].o.length)){
    const prev = p.prevOrder || [];
    p.order = ex.items.map((it,i)=>shuffledIdx(it.o.length, prev[i]));
    delete p.prevOrder; persist();
  }
  box.innerHTML = ex.items.map((it,i)=>{
    const ans = p.answers[i];
    const shown = atEnd ? p.checked : ans!==undefined;
    const q = esc(it.q).replace("___",'<b style="letter-spacing:2px">_____</b>');
    const opts = p.order[i].map((j,pos)=>{
      const o = it.o[j];
      let cls="opt";
      if(shown){ if(j===it.a) cls+=" right"; else if(j===ans) cls+=" wrong"; }
      else if(j===ans) cls+=" sel";
      return `<button class="${cls}" data-q="${i}" data-o="${j}" ${shown?"disabled":""}>${String.fromCharCode(97+pos)}) ${esc(o)}</button>`;
    }).join("");
    const au = auOf(l, ex), hasAu = au.includes(i+1) && (ex.listen || shown);
    const why = shown ? `<div class="why ${ans===it.a?"ok":"no"}">${ans===it.a?`<b>${CORRECT[S.lang]||t("correct")}</b> `:""}${tx(it.why)}</div>` : "";
    return `<div class="q"><div lang="en">${hasAu?playBtn(i+1):""}<span class="qn">${i+1}</span>${q}</div><div class="opts" lang="en">${opts}</div>${why}</div>`;
  }).join("") + mcSummary(ex,p);
  wirePlay(box, l, ex);
  box.querySelectorAll(".opt").forEach(b=> b.onclick=()=>{
    const i=+b.dataset.q;
    if(atEnd){ if(p.checked) return; }
    else if(p.answers[i]!==undefined) return;
    p.answers[i]=+b.dataset.o; persist(p);
    if(!atEnd){
      track("answer", {l:l.id, x:ex.id, i:i+1, ok: p.answers[i]===ex.items[i].a ? 1 : 2, d: ex.items[i].o[p.answers[i]]});
      if(Object.keys(p.answers).length===ex.items.length) trackDone(l, ex, p);
    }
    const y = window.scrollY; renderLesson(); window.scrollTo(0,y);
  });
  const ck=$("#check"); if(ck) ck.onclick=()=>{
    const left = ex.items.length-Object.keys(p.answers).length;
    if(left>0) toast(left===1?t("missingItem1"):t("missingItemN",{n:left}));
    ex.items.forEach((it,i)=>{ const a=p.answers[i]; track("answer", {l:l.id, x:ex.id, i:i+1, ok: a===it.a ? 1 : 2, d: a===undefined ? "" : it.o[a]}); });
    trackDone(l, ex, p);
    p.checked=true; persist(p); renderLesson();
    const s=document.querySelector(".score"); if(s) s.scrollIntoView({behavior:"smooth",block:"center"});
  };
  wireReset(p);
}
/* Guarda a melhor nota de cada exercício (em %), que sobrevive ao "Refazer". Usada pela trilha. */
function recordBest(p, c, tot){
  const pct = tot ? Math.round(100*c/tot) : 0;
  if(p.best >= pct) return;
  const m = S.lesson && metaOf(S.lesson), was = m && lessonState(m).done;
  p.best = pct; p.bestAt = new Date().toISOString().slice(0,10); persist(p);
  if(m && !was && lessonState(m).done){
    toast(t("lessonDoneToast"));
    const tg = document.querySelector(".metarow .tags");
    if(tg && !tg.querySelector(".okt")) tg.insertAdjacentHTML("beforeend", `<span class="tag okt">✓ ${t("concluded")}</span>`);
  }
  const up = checkTrail(); if(up) toast(t("levelUpToast",{l:up}));
}
function scoreBox(c,tt){
  const msg = c===tt ? t("perfect") : c>=tt*0.7 ? t("good") : t("retryExpl");
  return `<div class="score"><b>${c}/${tt}</b><span class="msg">${msg}</span><button class="btn plain" id="redo">${t("redo")}</button></div>`;
}
function mcSummary(ex,p){
  const n = Object.keys(p.answers).length, total = ex.items.length;
  if(ex.reveal==="end" && !p.checked)
    return `<div class="center"><p class="small muted">${t("answered",{n,total})}</p><button class="btn" id="check" ${n===0?"disabled":""}>${t("check")}</button></div>`;
  if(ex.reveal!=="end" && n<total) return `<p class="small muted center">${t("answered",{n,total})}</p>`;
  const [c,tot]=exScore(ex,p);
  recordBest(p, c, tot);
  return scoreBox(c,tot);
}

/* ---------- Preencher texto/diálogo com banco de opções ---------- */
function bankOf(ex){
  if(ex._bank) return ex._bank;
  if(ex.bank){ ex._bank = ex.bank.slice(); return ex._bank; }
  const set = new Set(); Object.values(ex.answers).forEach(a=>set.add(a[0]));
  const order=["up","down","in","out","by","on","off","over","away","back","around","through","along","apart"];
  if(ex.layout==="dialogue" || ![...set].every(w=>order.includes(w))){ ex._bank = [...set].sort((a,b)=>a.localeCompare(b)); }
  else { ex._bank=[...set].sort((a,b)=>order.indexOf(a)-order.indexOf(b)); }
  return ex._bank;
}
/* Opções da lacuna: as da própria lacuna (ex.opts[n], em ordem embaralhada e fixa) ou o banco geral. */
function optionsFor(ex, p, n){
  const own = ex.opts && ex.opts[n];
  if(!own) return bankOf(ex);
  p.optOrder = p.optOrder || {};
  if(!Array.isArray(p.optOrder[n]) || p.optOrder[n].length!==own.length){ p.optOrder[n] = shuffledIdx(own.length); persist(); }
  return p.optOrder[n].map(j=>own[j]);
}
function capIfStart(before, val){
  if(sheetCaseSensitive) return val;
  const plain = before.replace(/<[^>]*>/g,"").trim();
  if(plain==="" || /[.?!]$/.test(plain)) return val.charAt(0).toUpperCase()+val.slice(1);
  return val;
}
let sheetCaseSensitive = false;
function renderGap(l, ex){
  sheetCaseSensitive = !!ex.caseSensitive;
  const p = progEx(l, ex);
  const box = $("#exBody");
  const reveal = p.checked && S.reveal === l.id+"/"+ex.id;
  const typed = ex.input==="type";
  /* Pista ao lado da lacuna (ex.: palavra-base na formação de palavras). */
  const hintHTML = n => ex.hint && ex.hint[n] ? `<span class="hint">(${esc(ex.hint[n])})</span>` : "";
  const blankHTML = (n, before) => {
    const v = p.answers[n]; const accepted = ex.answers[n];
    let cls="blank", inner;
    if(p.checked){
      /* Depois da correção, o texto mantém as respostas do aluno; as certas só aparecem se ele pedir. */
      const ok = accepts(ex, accepted, v);
      if(ok){ cls += " ok"; inner = `<span class="v">${esc(capIfStart(before, v))}</span>`; }
      else if(reveal){ cls += " rev"; inner = `<span class="v">${esc(capIfStart(before, accepted[0]))}</span>`; }
      else { cls += " no"; inner = v ? `<span class="v">${esc(capIfStart(before,v))}</span>` : `<span class="v" style="text-decoration:none">&nbsp;</span>`; }
    } else if(typed){
      /* O valor entra depois, pela propriedade value (nunca como HTML). Corretor e sugestões desligados: entregariam a resposta. */
      const w = Math.min(40, Math.max(6, ...accepted.map(a=>a.length)) + 2);
      return `<span class="blank typed"><span class="n">${n}</span><input class="tin" data-n="${n}" type="text" lang="en" maxlength="${TYPED_MAX}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" style="width:${w}ch" aria-label="${esc(t("blank",{n}))}"></span>${hintHTML(n)}`;
    } else {
      if(S.activeBlank===n) cls+=" active";
      inner = `<span class="v">${v?esc(capIfStart(before,v)):"&nbsp;"}</span>`;
    }
    return `<button class="${cls}" data-n="${n}" aria-label="${esc(t("blank",{n})+(v?": "+v:""))}" ${p.checked?"disabled":""}><span class="n">${n}</span>${inner}</button>${hintHTML(n)}`;
  };
  const fill = text => {
    const parts = text.split(/\[\[(\d+)\]\]/); let out="", before="";
    parts.forEach((seg,i)=>{ if(i%2===0){ out+=esc(seg); before+=seg; } else { out+=blankHTML(+seg, before); before+="x"; } });
    return out;
  };
  let html = ex.scene ? `<div class="scene">${esc(tx(ex.scene))}</div>` : "";
  if(ex.layout==="dialogue"){
    /* O áudio entrega as respostas, então só aparece depois da correção. */
    const au = p.checked ? auOf(l, ex) : [];
    if(au.length) html += `<button class="btn plain sm playall" id="playAll">${t("playAll")}</button>`;
    html += `<div class="lines" lang="en">${ex.lines.map(([sp,line],i)=> au.includes(i+1)
      ? `<p class="au">${playBtn(i+1)}<span><span class="sp">${esc(sp)}:</span> ${fill(line)}</span></p>`
      : `<p><span class="sp">${esc(sp)}:</span> ${fill(line)}</p>`).join("")}</div>`;
  } else if(ex.layout==="text"){
    /* Texto corrido, sem numeração (ex.: open cloze). */
    html += `<div class="lines text" lang="en">${ex.lines.map(line=>`<p>${fill(line)}</p>`).join("")}</div>`;
  } else if(ex.layout==="transform"){
    /* Reescrita com palavra-chave: frase original, palavra-chave e frase nova com a lacuna. */
    html += `<div class="lines" lang="en">${ex.lines.map((it,i)=>`<div class="tf"><p class="src"><span class="num muted">${i+1}.</span> ${esc(it.src)}</p><p class="key">${esc(it.key)}</p><p class="tgt">${fill(it.text)}</p></div>`).join("")}</div>`;
  } else {
    html += `<div class="lines list" lang="en">${ex.lines.map((line,i)=>`<p><span class="num">${i+1}.</span><span>${fill(line)}</span></p>`).join("")}</div>`;
  }
  const total = Object.keys(ex.answers).length, filled = Object.keys(ex.answers).filter(k=>p.answers[k]).length;
  if(!p.checked){
    html += `<div class="center"><p class="small muted" id="filledMsg">${t("filled",{n:filled,total})}</p><button class="btn" id="check" ${filled===0?"disabled":""}>${t("check")}</button></div>`;
  } else {
    const [c,tot] = exScore(ex,p);
    recordBest(p, c, tot);
    html += scoreBox(c,tot);
    if(c<tot) html += `<div class="revealbar"><button class="btn plain sm" id="reveal">${reveal?t("hideAnswers"):t("showAnswers")}</button></div>`;
    html += `<div class="corr">${Object.keys(ex.answers).map(k=>{
      const acc=ex.answers[k], ok=accepts(ex, acc, p.answers[k]);
      const alt = acc.length>1 ? ` <span class="muted small">(${t("also")}: ${esc(acc.slice(1).join(" / "))})</span>` : "";
      return `<div><span class="k ${ok?"ok":"no"}">${ok?"✓":"✗"} ${k}</span> ${tx(ex.why[k])}${alt}</div>`;
    }).join("")}</div>`;
  }
  box.innerHTML = html;
  box.querySelectorAll("button.blank").forEach(b=> b.onclick=()=> openSheet(l, ex, +b.dataset.n));
  if(typed && !p.checked) wireTyped(box, ex, p, total);
  const rv=$("#reveal"); if(rv) rv.onclick=()=>{ if(!reveal) track("reveal",{l:l.id, x:ex.id}); S.reveal = reveal ? null : l.id+"/"+ex.id; const y=window.scrollY; renderLesson(); window.scrollTo(0,y); };
  wirePlay(box, l, ex);
  const ck=$("#check"); if(ck) ck.onclick=()=>{
    /* Contagem refeita na hora: nas respostas digitadas, o aluno preenche sem redesenhar a tela. */
    const filled = Object.keys(ex.answers).filter(k=>p.answers[k]).length;
    if(filled<total){ toast(total-filled===1?t("missingBlank1"):t("missingBlankN",{n:total-filled})); }
    Object.keys(ex.answers).forEach(k=>{ const v=p.answers[k]; track("answer", {l:l.id, x:ex.id, i:+k, ok: accepts(ex, ex.answers[k], v) ? 1 : 2, d: typed ? statText(v) : (v||"")}); });
    trackDone(l, ex, p);
    p.checked=true; persist(p); closeSheet(); renderLesson();
    const s=document.querySelector(".score"); if(s) s.scrollIntoView({behavior:"smooth",block:"center"});
  };
  wireReset(p);
}

/* ---------- Resposta digitada ----------
   Cada tecla guarda a resposta (sem redesenhar a tela, para não perder o foco). Enter vai para a próxima lacuna. */
function wireTyped(box, ex, p, total){
  const ins = [...box.querySelectorAll("input.tin")];
  const msg = $("#filledMsg"), ck = $("#check");
  const count = () => Object.keys(ex.answers).filter(k=>p.answers[k]).length;
  ins.forEach((inp,i)=>{
    const n = inp.dataset.n;
    inp.value = typeof p.answers[n]==="string" ? p.answers[n] : "";
    inp.oninput = () => {
      const v = inp.value.slice(0, TYPED_MAX);
      if(v.trim()) p.answers[n] = v; else delete p.answers[n];
      persist(p);
      const f = count();
      if(msg) msg.textContent = t("filled",{n:f,total});
      if(ck) ck.disabled = f===0;
    };
    inp.onkeydown = e => {
      if(e.key!=="Enter") return;
      e.preventDefault();
      const next = ins[i+1]; if(next) next.focus(); else inp.blur();
    };
  });
}

/* ---------- Apagar progresso do exercício ---------- */
function wireReset(p){
  const doReset = () => { if(S.lesson){ const e=exsOf(S.lesson)[S.ex]; if(e){ track("redo",{l:S.lesson.id, x:e.id}); S.exStart=Date.now(); } } S.reveal=null; p.answers={}; p.checked=false; delete p.optOrder; if(p.order){ p.prevOrder=p.order; delete p.order; } persist(p); closeSheet(); renderLesson(); window.scrollTo(0,0); toast(t("erased")); };
  const r = $("#redo"); if(r) r.onclick = doReset;
  const bar = $("#resetbar"); if(!bar) return;
  const has = p.checked || Object.keys(p.answers).length>0;
  if(!has){ bar.innerHTML=""; return; }
  const idle = () => {
    bar.innerHTML = `<button class="linkbtn" id="rsAsk">${t("resetAsk")}</button>`;
    $("#rsAsk").onclick = () => {
      bar.innerHTML = `<span>${t("resetConfirm")}</span><button class="btn plain sm" id="rsNo">${t("cancel")}</button><button class="btn danger sm" id="rsYes">${t("erase")}</button>`;
      $("#rsNo").onclick = idle; $("#rsYes").onclick = doReset;
    };
  };
  idle();
}

/* ---------- Painel de opções ---------- */
let sheetCtx=null;
function openSheet(l, ex, n){
  sheetCtx={l,ex}; S.activeBlank=n;
  const p = prog(l.id, ex.id);
  $("#sheetTitle").textContent = t("blank",{n});
  $("#chips").innerHTML = optionsFor(ex, p, n).map(o=>`<button class="chip ${p.answers[n]!==undefined && same(ex,p.answers[n],o)?"sel":""}" data-v="${esc(o)}">${esc(o)}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(c=> c.onclick=()=> pick(c.dataset.v));
  $("#sheet").classList.add("open");
  refreshGap();
}
function pick(v){
  const {l,ex}=sheetCtx; const p=prog(l.id,ex.id);
  p.answers[S.activeBlank]=v; persist(p);
  const keys=Object.keys(ex.answers).map(Number);
  const next = keys.find(k=>k>S.activeBlank && !p.answers[k]) ?? keys.find(k=>!p.answers[k]);
  if(next!==undefined){ openSheet(l,ex,next); scrollToBlank(next); } else { closeSheet(); refreshGap(); }
}
function scrollToBlank(n){
  const b=document.querySelector(`.blank[data-n="${n}"]`); if(!b) return;
  const r=b.getBoundingClientRect(), sh=$("#sheet").getBoundingClientRect().height;
  if(r.bottom > window.innerHeight - sh - 20 || r.top < 70) window.scrollBy({top: r.top - 140, behavior:"smooth"});
}
function refreshGap(){ const y=window.scrollY; if(S.lesson && S.tab==="ex"){ renderLesson(); window.scrollTo(0,y); } }
function closeSheet(){ $("#sheet").classList.remove("open"); S.activeBlank=null; }
$("#sheetClose").onclick=()=>{ closeSheet(); refreshGap(); };
$("#sheetClear").onclick=()=>{ if(!sheetCtx) return; const p=prog(sheetCtx.l.id,sheetCtx.ex.id); delete p.answers[S.activeBlank]; persist(p); openSheet(sheetCtx.l,sheetCtx.ex,S.activeBlank); };

/* ---------- Cabeçalho ---------- */
$("#brand").onclick=()=>{ if(S.code){ if(location.hash.length>1) location.hash=""; else route(); } };
$("#codepill").onclick=()=>{
  closeSheet();
  app.innerHTML = `<div class="card" style="max-width:520px;margin:24px auto">
    <h2>${t("yourCode")}</h2><div class="bigcode">${esc(S.code)}</div>
    <div class="row" style="margin-top:16px"><button class="btn plain" id="cp">${t("copy")}</button><button class="btn ghost" id="out">${t("logout")}</button><span class="spacer"></span><button class="btn" id="bk">${t("back")}</button></div>
    <p class="small muted" style="margin-top:14px">${t("logoutNote")}</p>${noStats()?`<p class="small muted">${t("noStatsNote")}</p>`:""}</div>`;
  $("#cp").onclick=copyCode;
  $("#out").onclick=async()=>{
    const ok = await pushRemote();
    /* Enviado: apaga a cópia deste aparelho. Sem conexão: mantém a cópia (sem o código) para enviar na próxima entrada. */
    if(ok) localDel(S.hash); else toast(t("logoutPending"));
    S.code=null; S.hash=null; S.data=null; S.dirty=false; setLast(null);
    if(location.hash.length>1) location.hash=""; else route();
  };
  $("#bk").onclick=route;
};

/* ---------- Modo claro / escuro ----------
   Sem escolha: segue o aparelho. A escolha do aluno fica neste aparelho e nos dados do código (prefs.theme). */
const THEME_KEY = "ep-theme";
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const okTheme = v => v==="light" || v==="dark";
const darkMQ = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
function storedTheme(){ try{ const v = localStorage.getItem(THEME_KEY); return okTheme(v) ? v : null; }catch(e){ return null; } }
function applyTheme(fromCode){
  const c = S.data && S.data.prefs && S.data.prefs.theme;
  if(fromCode && okTheme(c)){ try{ localStorage.setItem(THEME_KEY, c); }catch(e){} }
  const pick = (okTheme(c) ? c : null) || storedTheme();
  const th = pick || (darkMQ && darkMQ.matches ? "dark" : "light");
  document.documentElement.dataset.theme = th;
  const b = $("#themeBtn"), lbl = t(th==="dark" ? "themeLight" : "themeDark");
  b.innerHTML = th==="dark" ? ICON_SUN : ICON_MOON; b.setAttribute("aria-label", lbl); b.title = lbl;
}
$("#themeBtn").onclick = () => {
  const next = document.documentElement.dataset.theme==="dark" ? "light" : "dark";
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  if(S.data){ S.data.prefs = Object.assign({}, S.data.prefs, {theme:next}); persist(S.data.prefs); }
  applyTheme();
};
if(darkMQ){ const f = () => applyTheme(); darkMQ.addEventListener ? darkMQ.addEventListener("change", f) : darkMQ.addListener(f); }
applyTheme();

window.addEventListener("hashchange", route);
$("#sheetClear").textContent=t("clear"); $("#sheetClose").textContent=t("close");
(async function init(){
  await migrateOldStore();
  const last=getLast();
  track("visit", {d: String(navigator.language||"").slice(0,10), ok: last ? 1 : 2});
  if(last){
    app.innerHTML = `<p class="muted center">${t("loading")}</p>`;
    const msg = await login(last);
    if(msg){ setLast(null); renderGate(msg); }
  } else route();
})();
</script>
